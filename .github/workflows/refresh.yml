name: refresh

on:
  schedule:
    # 每 30 分钟一次（UTC，:01/:31，与 GLM 的 :03/:33 错开）。
    # 实测 10 分钟档会被 GitHub 节流到约 2 小时一次；30 分钟是可靠兑现的档位
    - cron: '1,31 * * * *'
  workflow_dispatch: {}   # 允许 Actions 页面手动触发

permissions:
  contents: write   # 刷新后的 token 状态需要提交回仓库

concurrency:
  group: refresh
  cancel-in-progress: false   # token 是轮换的，绝不能并行跑

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUOTE0_API_KEY: ${{ secrets.QUOTE0_API_KEY }}
      QUOTE0_DEVICE_ID: ${{ secrets.QUOTE0_DEVICE_ID }}
      CODEX_REFRESH_TOKEN: ${{ secrets.CODEX_REFRESH_TOKEN }}
      CODEX_ACCOUNT_ID: ${{ secrets.CODEX_ACCOUNT_ID }}
      CODEX_STATE_KEY: ${{ secrets.CODEX_STATE_KEY }}
      CODEX_STATE_FILE: state/codex_tokens.json.enc
      QUOTE0_IMAGE_TASK_KEY: ${{ secrets.QUOTE0_IMAGE_TASK_KEY }}
      QUOTE0_REFRESH_NOW: 'true'    # 循环列表卡片推送后立即刷新
      QUOTE0_PREVIEW_PATH: tmp/preview.png
      TZ: 'Asia/Shanghai'   # 屏上时间戳时区（运行器默认 UTC）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Refresh Codex OAuth token (encrypted state)
        run: python scripts/gh_refresh_codex_token.py

      - name: Render preview and push to Quote/0
        run: |
          python display.py --preview
          python display.py

      - name: Commit refreshed token state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/codex_tokens.json.enc
          if git diff --cached --quiet; then
            echo "token state unchanged — nothing to commit"
          else
            git commit -m "chore: rotate codex token state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Upload preview
        if: failure()   # 5 分钟一次的节奏，只在失败时留产物排查
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: tmp/preview.png
          retention-days: 3
